<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слайди уроку — навчальні матеріали</title>
<link rel="stylesheet" href="assets/site.css">
<link rel="stylesheet" href="assets/slides.css">
<script src="assets/theme.js"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml" data-head-v1>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="author" content="Процюк О. К.">
<meta name="description" content="Слайди проведеного уроку з інформатики — можна переглянути повторно або надолужити пропущене.">
<meta name="robots" content="index,follow">
<meta property="og:type" content="article">
<meta property="og:site_name" content="Навчальні матеріали">
<meta property="og:locale" content="uk_UA">
<meta property="og:title" content="Слайди уроку">
<meta property="og:description" content="Слайди проведеного уроку з інформатики — можна переглянути повторно або надолужити пропущене.">
<meta property="og:url" content="https://strykers79.github.io/school-games/slides.html">
<meta property="og:image" content="https://strykers79.github.io/school-games/og-cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
</head>
<body class="viewer">

<div class="vtop top">
  <a class="home" href="materials.html" title="До каталогу матеріалів">←</a>
  <div class="vtitle" id="vtitle">завантаження…</div>
  <div class="counter" id="counter"></div>
  <div class="vacts">
    <a class="iconbtn" id="pdf" href="#" hidden>PDF</a>
    <button class="iconbtn" id="full" type="button" hidden>на весь екран</button>
  </div>
</div>

<div class="stage" id="stage">
  <img id="slide" alt="" hidden>
  <button class="zone prev" id="zprev" type="button" aria-label="Попередній слайд" hidden></button>
  <button class="zone next" id="znext" type="button" aria-label="Наступний слайд" hidden></button>
</div>

<div class="vbot"><div class="dots" id="dots"></div></div>
<p class="hint" id="hint" hidden>Стрілки ← → або клік по краях картинки. <b>Esc</b> — вийти з повного екрана.</p>

<div class="empty" id="empty" hidden></div>

<footer data-sig>
  © 2025–2026 <b>Процюк О. К.</b> · вчитель інформатики<br>
  Комунальний заклад «Харківський ліцей № 47 Харківської міської ради»
  <br><a class="doclink" data-doc href="about.html">Про сайт і дані</a>
</footer>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);

  const fail = html => {
    $("vtitle").textContent = "Слайди";
    $("empty").innerHTML = html;
    $("empty").hidden = false;
  };

  const slug = q.get("m") || "";
  // ⚠️ Тільки [a-z0-9-]: slug приходить з адреси, тобто від сторонньої людини,
  // і підставляється в шлях до файлу. Без цієї перевірки — «../» у назві.
  if (!/^[a-z0-9-]+$/.test(slug)) {
    fail("Не вказано, який саме урок відкрити.<br><br>" +
         '<a class="btn" href="materials.html">До каталогу матеріалів →</a>');
    return;
  }

  fetch("materials/manifest.json", { cache: "no-cache" })
    .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
    .then(man => {
      const les = (man.lessons || []).find(e => e.slug === slug);
      if (!les) throw new Error("немає в переліку");
      start(les);
    })
    .catch(() => fail(
      "Цей урок ще <b>не виклали</b> на сайт — або посилання застаріло.<br><br>" +
      '<a class="btn" href="materials.html">Подивитися, що вже є →</a>'));

  function start(les) {
    const total = les.slides;
    const src = n => "materials/" + les.slug + "/" + String(n).padStart(2, "0") + ".webp";
    const img = $("slide"), dots = $("dots");
    let cur = Math.min(Math.max(parseInt(q.get("s"), 10) || 1, 1), total);

    document.title = les.title + " — слайди уроку";
    $("vtitle").innerHTML = les.title + " <span>· урок " + les.lesson +
      " · " + les.cls + "</span>";
    if (les.pdf) {
      const a = $("pdf");
      a.href = "materials/" + les.slug + "/deck.pdf";
      a.title = "Той самий урок одним файлом — можна зберегти й роздрукувати";
      a.hidden = false;
    }
    for (const el of [img, $("zprev"), $("znext"), $("full"), $("hint")]) el.hidden = false;

    for (let i = 1; i <= total; i++) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "dot";
      b.setAttribute("aria-label", "Слайд " + i);
      b.onclick = () => go(i);
      dots.appendChild(b);
    }

    // ⭐ Наступний слайд підгружаємо заздалегідь: на шкільному Wi-Fi це різниця
    // між «клік — і одразу» та «клік — біла пляма на секунду».
    const warm = n => { if (n >= 1 && n <= total) new Image().src = src(n); };

    function go(n) {
      cur = Math.min(Math.max(n, 1), total);
      img.src = src(cur);
      img.alt = "Слайд " + cur + " з " + total + " — " + les.title;
      $("counter").textContent = cur + " / " + total;
      [...dots.children].forEach((d, i) =>
        d.setAttribute("aria-current", i + 1 === cur ? "true" : "false"));
      $("zprev").disabled = cur === 1;
      $("znext").disabled = cur === total;
      // ⚠️ replaceState, а не pushState: інакше «назад» у браузері виходило б
      // не з уроку, а по одному слайду через усі 15.
      history.replaceState(null, "", "?m=" + les.slug + (cur > 1 ? "&s=" + cur : ""));
      warm(cur + 1); warm(cur - 1);
    }

    $("zprev").onclick = () => go(cur - 1);
    $("znext").onclick = () => go(cur + 1);
    $("full").onclick = () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen)
        document.documentElement.requestFullscreen().catch(() => {});
    };

    document.addEventListener("keydown", e => {
      const k = e.key;
      if (k === "ArrowRight" || k === "PageDown" || k === " ") go(cur + 1);
      else if (k === "ArrowLeft" || k === "PageUp") go(cur - 1);
      else if (k === "Home") go(1);
      else if (k === "End") go(total);
      else return;
      e.preventDefault();
    });

    // свайп на телефоні: рахуємо лише виразно горизонтальний рух,
    // щоб не перебивати звичайну прокрутку сторінки
    let x0 = null, y0 = null;
    const stage = $("stage");
    stage.addEventListener("touchstart", e => {
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
    }, { passive: true });
    stage.addEventListener("touchend", e => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      const dy = e.changedTouches[0].clientY - y0;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
      x0 = y0 = null;
    }, { passive: true });

    go(cur);
  }
})();
</script>
</body>
</html>
