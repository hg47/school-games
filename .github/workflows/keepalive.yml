# ============================================================
#  Тримає базу Supabase активною.
#
#  Навіщо: на безкоштовному тарифі Supabase ставить на паузу проєкт,
#  до бази якого тиждень майже немає запитів. Дані при цьому цілі,
#  але вхід учня за кодом перестає працювати, поки вчитель не натисне
#  Resume в дашборді. А запити до нашої бази бувають лише в дні
#  підсумкових робіт — тобто раз на кілька тижнів.
#
#  Що робить: двічі на добу звертається до бази. Запит ТІЛЬКИ ЧИТАЄ —
#  шукає неіснуючий код і отримує «Код не знайдено». Нічого не пише,
#  нікого не оцінює, жодного рядка в таблицях не змінює.
#
#  Ключ нижче — публічний (той самий, що вже лежить у supabase-config.js
#  і видно в коді кожної сторінки). Доступ обмежує RLS, не таємність ключа.
#
#  Якщо база не відповість — крок падає, і GitHub надсилає листа.
#  Тобто це ще й сигналізація: дізнаєтесь про проблему НЕ на уроці.
# ============================================================

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 6 * * *"     # щодня 06:00 UTC (09:00 Київ узимку, 10:00 влітку)
    - cron: "0 18 * * *"    # і 18:00 UTC
  workflow_dispatch:         # плюс кнопка ручного запуску у вкладці Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Запит до бази
        env:
          SB_URL: https://bxisrqyfmkgxsvpvbkme.supabase.co
          SB_KEY: sb_publishable_mYEUdMbaDByzAuz7_0euJw_9POCrKcq
        run: |
          fail=0
          for i in 1 2; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" -m 30 \
              -X POST "$SB_URL/rest/v1/rpc/redeem_code" \
              -H "apikey: $SB_KEY" \
              -H "Authorization: Bearer $SB_KEY" \
              -H "Content-Type: application/json" \
              -d '{"p_code":"__keepalive__"}')
            echo "запит $i -> HTTP $code -> $(cat /tmp/out.json 2>/dev/null)"
            if [ "$code" != "200" ]; then fail=1; fi
            sleep 20
          done
          if [ "$fail" = "1" ]; then
            echo "::error::База не відповіла. Найімовірніше проєкт Supabase на паузі: зайти в дашборд і натиснути Resume project."
            exit 1
          fi
          echo "База жива."
